<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevOps AI Sales Assistant - Standalone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #05051a;
            --card-bg: rgba(10, 10, 42, 0.8);
            --accent: linear-gradient(135deg, #6b5cd7 0%, #44e8de 100%);
            --accent-solid: #6b5cd7;
            --text-main: #ffffff;
            --text-muted: #8ba2d4;
            --glass-border: rgba(68, 232, 222, 0.2);
            --shadow: 0 15px 35px rgba(5, 5, 26, 0.8), 0 0 20px rgba(107, 92, 215, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #05051a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(107, 92, 215, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(68, 232, 222, 0.2) 0px, transparent 50%);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Floating Bubble */
        .chat-bubble {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(68, 232, 222, 0.4);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .chat-bubble:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
        }

        .chat-bubble .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--accent-solid);
            opacity: 0.5;
            z-index: -1;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Chat Container */
        .chat-container {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 400px;
            height: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(107, 92, 215, 0.1);
            z-index: 1001;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom right;
        }

        .chat-container.hidden {
            transform: scale(0.5) translateY(50px);
            opacity: 0;
            pointer-events: none;
        }

        /* Header */
        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .chat-header h3 {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slide-in 0.3s ease-out forwards;
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            width: fit-content;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Result Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .badge.relevant { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge.not-relevant { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Input Area */
        .chat-input-area {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 15px;
            color: white;
            resize: none;
            font-size: 0.9rem;
            max-height: 100px;
            outline: none;
        }

        textarea:focus { border-color: var(--accent-solid); }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Graphics */
        .bg-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        .bg-text h1 { font-size: 8rem; font-weight: 800; }
    </style>
</head>
<body>
    <div class="bg-text">
        <h1>REVOPS</h1>
        <p>AI SALES ASSISTANT STANDALONE</p>
    </div>

    <!-- Floating Bubble -->
    <div id="chat-bubble" class="chat-bubble">
        <i class="fas fa-robot"></i>
        <div class="pulse"></div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container" class="chat-container hidden">
        <div class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <h3>RevOps Assistant</h3>
            </div>
            <button id="close-chat" class="close-btn">&times;</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="message bot">
                Hi! I'm your AI Sales Assistant. Paste some lead details here (Name, Title, Company, Size, Industry) and I'll analyze if they're a fit for your RevOps tool.
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="user-input" placeholder="e.g. John Smith, Head of RevOps, HubSpot, 150 employees, B2B SaaS..." rows="1"></textarea>
            <button id="send-btn" class="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const bubble = document.getElementById('chat-bubble');
        const container = document.getElementById('chat-container');
        const closeBtn = document.getElementById('close-chat');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const messagesContainer = document.getElementById('chat-messages');

        bubble.addEventListener('click', () => container.classList.toggle('hidden'));
        closeBtn.addEventListener('click', () => container.classList.add('hidden'));

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        const sendMessage = () => {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            showTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                addMessage(analyzeLead(text), 'bot', true);
            }, 1200);
        };

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        function addMessage(content, sender, isHTML = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (isHTML) msgDiv.innerHTML = content;
            else msgDiv.textContent = content;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function analyzeLead(input) {
            const lowerInput = input.toLowerCase();
            const idealTitles = ['revops', 'vp of sales', 'revenue operations', 'cro', 'sales operations'];
            const idealIndustries = ['saas', 'tech', 'software', 'b2b'];
            const nonFitIndustries = ['b2c', 'retail', 'manufacturing', 'healthcare', 'bakery', 'restaurant'];
            const sizeMatch = input.match(/(\d+)\s*( employees| staff| headcount)/i);
            const size = sizeMatch ? parseInt(sizeMatch[1]) : null;

            let score = 0;
            const hasIdealTitle = idealTitles.some(title => lowerInput.includes(title));
            if (hasIdealTitle) score += 5;
            if (idealIndustries.some(ind => lowerInput.includes(ind)) && !nonFitIndustries.some(ind => lowerInput.includes(ind))) score += 3;

            if (size) {
                if (size >= 20 && size <= 200) score += 2;
                else if (size < 10) return formatNotRelevant("Company size is too small (< 10 employees).", "A mid-sized tech company (20-200 employees)");
                else if (size > 500) return formatNotRelevant("Enterprise accounts (> 500) are not your current focus.", "A growing mid-market company.");
            } else if (hasIdealTitle) score += 1;

            if (score >= 6) return formatRelevant(score, input);
            return formatNotRelevant("The lead doesn't match the ICP criteria for role or industry.", "A Head of RevOps at a 50-150 employee SaaS company.");
        }

        function formatRelevant(score, input) {
            const parts = input.split(',').map(p => p.trim());
            const name = parts[0] || "there";
            return `
                <div class="badge relevant">✅ Relevant Lead</div>
                <strong>Fit Score: ${score}/10</strong><br><br>
                <strong>Why they fit:</strong> This lead matches your core persona perfectly.<br><br>
                <strong>Subject:</strong> Quick question about your pipeline data<br><br>
                <strong>Email:</strong> Hi ${name}, RevOps leaders tell me their biggest headache is trusting CRM numbers. If that resonates, let's chat.
            `;
        }

        function formatNotRelevant(reason, betterFit) {
            return `
                <div class="badge not-relevant">❌ Not Relevant</div>
                <strong>Reason:</strong> ${reason}<br><br>
                <strong>Better fit would be:</strong> ${betterFit}
            `;
        }
    </script>
</body>
</html>
